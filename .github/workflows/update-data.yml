name: Daily Data Update

on:
  schedule:
    # 每天北京时间 09:00（UTC 01:00）自动执行一次
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      quota:
        description: "本次新增收录作品数量（默认 5 部：建筑/工业/美术/渲染/商品3D展板）"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run daily data update script
        env:
          DAILY_QUOTA_INPUT: ${{ inputs.quota || '5' }}
        run: python scripts/update-data.py --quota "$DAILY_QUOTA_INPUT"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-feed.json assets/refs/
          if git diff --cached --quiet; then
            echo "No new data changes to commit."
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          git commit -m "chore(data): daily AI design vault update (${TODAY})"
          git pull --rebase origin main
          git push origin HEAD:main
