name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Daily Data Update"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Stage static site files
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html linear.html stripe.html .nojekyll _site/
          cp -r assets design-vault src _site/
          cp data/daily-feed.json _site/data/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
